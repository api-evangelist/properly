actions:
  apisYmlCreated: true
  apisListed: 0
  openapiDirectoryCreated: false
  reason: >-
    apis[] is deliberately empty. Properly documents no public API and no longer serves a web
    application of its own, and its successor Pine documents none either. Listing the
    undocumented api.pine.ca gateway would misrepresent a private, auth-refusing implementation
    detail as a developer product. No specification of any kind — OpenAPI, Swagger, OData
    $metadata, AsyncAPI, GraphQL, or Postman — was found, so no openapi/ directory was created.
